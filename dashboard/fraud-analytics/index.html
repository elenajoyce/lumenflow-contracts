<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fraud Analytics — LumenFlow</title>
  <!-- Apply stored theme before first paint to prevent FOUC -->
  <script>
    (function () {
      const stored = localStorage.getItem('lumenflow_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (stored === 'dark' || (!stored && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else if (stored === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <style>
    /* Minimal inline styles — no external dependency so the page renders even
       if shared.css isn't available (e.g. opened as a standalone file). */
    :root {
      --color-bg:           #f5f7fa;
      --color-surface:      #ffffff;
      --color-surface-alt:  #f0f2f5;
      --color-border:       #e0e0e6;
      --color-text:         #0b1726;
      --color-text-muted:   #5a6880;
      --color-accent:       #0b66ff;
      --color-accent-text:  #ffffff;
      --color-danger:       #d63031;
      --color-success:      #00b894;
      --color-warning:      #fdcb6e;
      --color-warning-text: #7a5200;
      --color-live:         #00b894;
      --color-reconnecting: #fdcb6e;
      --shadow-card:        0 2px 8px rgba(0,0,0,.07);
      --radius:             6px;
      --radius-lg:          10px;
    }
    [data-theme="dark"] {
      --color-bg:           #0d1117;
      --color-surface:      #161b22;
      --color-surface-alt:  #1c2330;
      --color-border:       #30363d;
      --color-text:         #e6edf3;
      --color-text-muted:   #8b949e;
      --color-accent:       #58a6ff;
      --color-accent-text:  #0d1117;
      --color-danger:       #f85149;
      --color-success:      #3fb950;
      --color-warning:      #d29922;
      --color-warning-text: #f0e68c;
      --color-live:         #3fb950;
      --color-reconnecting: #d29922;
      --shadow-card:        0 2px 8px rgba(0,0,0,.4);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --color-bg:           #0d1117;
        --color-surface:      #161b22;
        --color-surface-alt:  #1c2330;
        --color-border:       #30363d;
        --color-text:         #e6edf3;
        --color-text-muted:   #8b949e;
        --color-accent:       #58a6ff;
        --color-accent-text:  #0d1117;
        --color-danger:       #f85149;
        --color-success:      #3fb950;
        --color-warning:      #d29922;
        --color-warning-text: #f0e68c;
        --color-live:         #3fb950;
        --color-reconnecting: #d29922;
        --shadow-card:        0 2px 8px rgba(0,0,0,.4);
      }
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    .site-header { display:flex; justify-content:space-between; align-items:center; padding: 14px 20px; background: var(--color-surface); border-bottom: 1px solid var(--color-border); box-shadow: var(--shadow-card); position: sticky; top:0; z-index:50; }
    .site-header h1 { font-size: 1.15rem; margin: 0; }
    .header-actions { display:flex; align-items:center; gap:12px; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap:16px; margin-bottom:24px; }
    .metric-card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: 16px 20px; box-shadow: var(--shadow-card); }
    .metric-card .label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color: var(--color-text-muted); margin-bottom:6px; }
    .metric-card .value { font-size:1.75rem; font-weight:700; color: var(--color-text); }
    .metric-card.danger .value { color: var(--color-danger); }
    .metric-card.warning .value { color: var(--color-warning); }
    .section-title { font-size:1rem; font-weight:700; margin-bottom:12px; }
    .table-wrapper { overflow-x:auto; background: var(--color-surface); border:1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:10px 14px; border-bottom:1px solid var(--color-border); text-align:left; white-space:nowrap; }
    th { background: var(--color-surface-alt); color: var(--color-text-muted); font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background: var(--color-surface-alt); }
    .empty { padding:32px; text-align:center; color: var(--color-text-muted); font-size:.9rem; }
    .badge { display:inline-block; padding:2px 8px; border-radius:99px; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
    .badge-high   { background: var(--color-danger);  color:#fff; }
    .badge-medium { background: var(--color-warning); color: var(--color-warning-text); }
    .badge-low    { background: var(--color-success); color:#fff; }
    button { padding:6px 12px; border:1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); border-radius: var(--radius); cursor:pointer; font-size:.82rem; transition: background .15s; }
    button:hover { background: var(--color-surface-alt); }
    button:focus { outline:3px solid rgba(88,166,255,.35); outline-offset:2px; }

    /* Status indicator */
    .status-indicator { display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-weight:700; padding:3px 10px; border-radius:99px; border:1px solid currentColor; }
    .status-indicator::before { content:''; display:inline-block; width:8px; height:8px; border-radius:50%; background:currentColor; }
    .status-indicator.live { color: var(--color-live); border-color: var(--color-live); }
    .status-indicator.reconnecting { color: var(--color-reconnecting); border-color: var(--color-reconnecting); }
    .status-indicator.live::before { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    .skip-link { position:absolute; left:-999px; top:auto; width:1px; height:1px; overflow:hidden; }
    .skip-link:focus { left:8px; top:8px; width:auto; height:auto; padding:8px; background: var(--color-surface); border:1px solid var(--color-border); z-index:200; }
  </style>
</head>
<body>
  <a href="#content" class="skip-link">Skip to content</a>
  <header class="site-header">
    <h1>Fraud Analytics</h1>
    <div class="header-actions">
      <span id="streamStatus" class="status-indicator reconnecting" role="status" aria-live="polite">Connecting…</span>
      <button id="themeToggle" aria-label="Toggle dark mode">🌙 Dark</button>
    </div>
  </header>

  <main id="content">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="label">Total Alerts</div>
        <div class="value" id="metricTotal">0</div>
      </div>
      <div class="metric-card danger">
        <div class="label">High Severity</div>
        <div class="value" id="metricHigh">0</div>
      </div>
      <div class="metric-card warning">
        <div class="label">Medium Severity</div>
        <div class="value" id="metricMedium">0</div>
      </div>
      <div class="metric-card">
        <div class="label">Monitored Addresses</div>
        <div class="value" id="metricAddresses">0</div>
      </div>
    </div>

    <h2 class="section-title">Recent Suspicious Activity</h2>
    <div class="table-wrapper">
      <div id="emptyState" class="empty">No suspicious activity detected.</div>
      <table id="eventsTable" aria-label="Suspicious activity events" style="display:none">
        <thead>
          <tr>
            <th scope="col">Time</th>
            <th scope="col">Address</th>
            <th scope="col">Reason</th>
            <th scope="col">Amount</th>
            <th scope="col">Severity</th>
          </tr>
        </thead>
        <tbody id="eventsBody"></tbody>
      </table>
    </div>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
